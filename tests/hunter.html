<!doctype html><html lang="ru"><meta charset="utf-8"><title>Hunter — проверка ветки</title>
<style>body{margin:12px;background:#18222c;color:white;font:14px Arial}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}select,button{padding:8px;font:inherit}iframe{width:390px;height:660px;border:1px solid #678;border-radius:10px}p{font-size:12px;max-width:600px}</style>
<header><label>Профессия <select id="stage"><option>Novice</option><option>Archer</option><option selected>Hunter</option></select></label><button id="show" disabled>Показать ветку</button><button id="motion" disabled>Запустить бой</button><label>Экран <select id="size"><option value="390,660">390 × 660</option><option value="320,480">320 × 480</option><option value="844,390">844 × 390</option></select></label></header>
<p>Проверка настоящего движка: мужской спрайт, лук, сокол и ловушки. Тестовый профиль не перезаписывает обычное сохранение.</p>
<iframe id="preview" title="Проверка Hunter" src="../index.html?test=1&amp;scene=1&amp;v=0.11.0"></iframe>
<script>
const preview=document.getElementById('preview');let frozen=true;
preview.onload=()=>{document.getElementById('show').disabled=!preview.contentWindow.RS_TEST;document.getElementById('motion').disabled=!preview.contentWindow.RS_TEST};
document.getElementById('size').onchange=e=>{const[w,h]=e.target.value.split(',');preview.style.width=w+'px';preview.style.height=h+'px'};
document.getElementById('show').onclick=()=>{
 const w=preview.contentWindow,g=w.RS_TEST,db=w.RS_DATABASE;
 g.reset('hunter_male');g.start();
 g.xp(db.experience.base.slice(1,80).reduce((a,b)=>a+b,0)/db.settings.experienceRates.base,0);
 g.state.stage=document.getElementById('stage').value;g.state.job=g.state.stage==='Novice'?10:50;
 const levels={basic:9,owls_eye:10,vultures_eye:10,double_strafe:10,improve_concentration:10,arrow_shower:9,
 beast_bane:10,falconry_mastery:1,blitz_beat:5,steel_crow:10,skid_trap:1,ankle_snare:5,land_mine:5,remove_trap:1,detect:4,flasher:1,freezing_trap:1,sandman:1,blast_mine:1,shockwave_trap:1,claymore_trap:1,spring_trap:1};
 for(const d of db.skills)if(d.jobId==='novice'||(g.state.stage!=='Novice'&&d.jobId==='archer')||(g.state.stage==='Hunter'&&d.jobId==='hunter'))g.state[d.stateKey]=levels[d.stateKey]||0;
 for(const d of db.skills)if(d.utility)g.state.skillEnabled[d.id]=false;
 g.state.skillPoints=0;g.state.pause=false;g.state.debugInfiniteHp=true;g.state.debugInfiniteSp=true;g.state.t=60;g.state.nextBoss=1e9;g.state.spawn=100;
 g.awardJobXp(0);g.recalc(true);
 for(let i=0;i<6;i++){g.spawn();const e=g.enemies().at(-1);e.x=g.player.x+120+(i%3)*40;e.y=g.player.y-85+Math.floor(i/3)*110;e.hp=e.max=100000;e.speed=0;}
 g.state.attack=0;g.update(0);g.state.pause=true;g.draw();frozen=true;
 setTimeout(()=>{g.pause();g.state.pause=true;g.draw()},130);
};
document.getElementById('motion').onclick=e=>{const g=preview.contentWindow.RS_TEST;frozen=!frozen;g.state.pause=frozen;e.target.textContent=frozen?'Запустить бой':'Заморозить бой'};
</script></html>
