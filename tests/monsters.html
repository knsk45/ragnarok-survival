<!doctype html><html lang="ru"><meta charset="utf-8"><title>Ragnarok — проверка обычных монстров</title>
<style>body{margin:12px;background:#18222c;color:#fff;font:14px Arial}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}select,button{font:inherit;padding:8px}iframe{width:390px;height:660px;border:1px solid #789;border-radius:10px}p{font-size:12px;max-width:650px}.scene{display:flex;gap:15px;align-items:flex-start}aside{max-width:320px}#roster{padding-left:20px;line-height:1.7}</style>
<header><label>Партия <select id="batch"><option value="0">Новые · 1–12</option><option value="1">Новые · 13–24</option><option value="2">Новые · 25–35</option></select></label><button id="show" disabled>Показать монстров</button><label>Экран <select id="size"><option value="390,660">390 × 660</option><option value="320,480">320 × 480</option><option value="844,390">844 × 390</option></select></label></header>
<p>Оригинальные локальные спрайты в настоящем рендере игры. Сцена заморожена; HP и опыт не меняются, сохранение игрока не перезаписывается.</p>
<div class="scene"><iframe id="preview" title="Монстры в движке" src="../index.html?test=1&amp;scene=1&amp;v=0.12.0"></iframe><aside><h3 id="caption">35 новых монстров</h3><ol id="roster"></ol></aside></div>
<script>
const frame=document.getElementById('preview');
frame.onload=()=>document.getElementById('show').disabled=!frame.contentWindow.RS_TEST;
document.getElementById('size').onchange=e=>{const[w,h]=e.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px'};
document.getElementById('show').onclick=()=>{
 const w=frame.contentWindow,g=w.RS_TEST,db=w.RS_DATABASE,start=Number(document.getElementById('batch').value)*12;
 const rows=w.RS_MONSTER_EXPANSION_ARTWORK.slice(start,start+12).map(a=>db.monsters[a.key]);
 g.reset('hunter_male');g.start();g.state.t=60;g.state.spawn=1e9;g.state.nextBoss=1e9;g.state.debugInfiniteHp=true;
 for(let i=0;i<rows.length;i++){const m=rows[i];g.state.lvl=m.stats.level;g.spawn(m.key);const e=g.enemies().at(-1);e.x=g.player.x+(i%3-1)*108;e.y=g.player.y-135+Math.floor(i/3)*95;}
 g.state.lvl=99;g.state.stage='Hunter';g.state.pause=true;g.recalc(true);g.draw();
 document.getElementById('roster').replaceChildren(...rows.map(m=>{const li=document.createElement('li');li.textContent=m.name+' · Lv. '+m.stats.level+' · HP '+m.combat.hp;return li}));
 document.getElementById('caption').textContent='Партия '+(start/12+1)+' / 3';
};
</script></html>
