<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Ragnarok Survival — проверка мобильного интерфейса</title>
<style>body{font:14px Arial;background:#101820;color:#fff;margin:16px}label{display:block;margin-bottom:12px}select{padding:8px}iframe{display:block;border:1px solid #888;background:#467b49;width:390px;height:660px}</style>
<label>Тестовый размер игрового экрана
<select id="size"><option value="390,660">390 × 660 — вертикальный</option><option value="320,480">320 × 480 — малый экран</option><option value="430,740">430 × 740 — большой телефон</option><option value="844,390">844 × 390 — горизонтальный</option></select></label>
<iframe id="preview" title="Игра в мобильном размере" src="../index.html"></iframe>
<script>document.getElementById('size').onchange=function(){const[w,h]=this.value.split(',');const frame=document.getElementById('preview');frame.style.width=w+'px';frame.style.height=h+'px'}</script>
</html>
