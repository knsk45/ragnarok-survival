<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>Ragnarok — оригинальные ресурсы iRO Wiki</title>
<style>body{font:14px Arial;background:#18222c;color:#fff;margin:20px}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.asset{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;padding:8px;border:1px solid #788999;border-radius:8px;background:#416d43;min-height:135px;text-align:center}.asset img{max-width:110px;max-height:100px;image-rendering:pixelated}.asset small{font-size:10px;opacity:.8}</style>
<h1>Оригинальные ресурсы iRO Wiki · 0.12.0</h1><p>Локальные PNG без перерисовки и перекраски.</p><div id="gallery"></div>
<script src="../data/sources.js?v=0.12.0"></script><script src="../data/monsters.js?v=0.12.0"></script><script src="../data/monster-expansion.js?v=0.12.0"></script><script src="../data/bosses.js?v=0.12.0"></script><script src="../data/skills.js?v=0.12.0"></script><script src="../data/hunter.js?v=0.12.0"></script><script src="../data/buffs.js?v=0.12.0"></script><script src="../data/items.js?v=0.12.0"></script><script src="../data/artwork.js?v=0.12.0"></script>
<script>for(const a of RS_ARTWORK.files){const card=document.createElement('div');card.className='asset';const img=document.createElement('img');img.src='../'+a.path;img.alt=a.key;card.appendChild(img);const label=document.createElement('span');label.textContent=a.key;card.appendChild(label);const dimensions=document.createElement('small');dimensions.textContent=a.width+'×'+a.height+' · '+a.group;card.appendChild(dimensions);document.getElementById('gallery').appendChild(card)}</script></html>
