<!doctype html><html lang="ru"><meta charset="utf-8"><title>Wizard и Assassin — проверка</title>
<style>body{margin:12px;background:#18222c;color:white;font:14px Arial}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}select,button{padding:8px;font:inherit}iframe{width:390px;height:660px;border:1px solid #678;border-radius:10px}p{max-width:720px;line-height:1.5}</style>
<header><label>Профессия <select id="stage"><option>Mage</option><option selected>Wizard</option><option>Thief</option><option>Assassin</option></select></label><label>Оружие Assassin <select id="weapon"><option value="katar">Катар</option><option value="dual">Два кинжала</option></select></label><button id="show" disabled>Показать</button><button id="motion" disabled>Запустить бой</button><label>Экран <select id="size"><option value="390,660">390 × 660</option><option value="320,480">320 × 480</option><option value="844,390">844 × 390</option><option value="1366,768">1366 × 768</option></select></label></header>
<p>Настоящий движок: оригинальные мужские спрайты, стихийная магия, зоны заклинаний и ядовитые атаки. Демонстрация открывает все реализованные навыки вне обычной прогрессии. Тестовый профиль не перезаписывает игровое сохранение.</p>
<iframe id="preview" title="Проверка профессий" src="../index.html?test=1&amp;scene=1&amp;v=0.13.0"></iframe>
<script>
const preview=document.getElementById('preview');let frozen=true;
preview.onload=()=>{document.getElementById('show').disabled=!preview.contentWindow.RS_TEST;document.getElementById('motion').disabled=!preview.contentWindow.RS_TEST};
document.getElementById('size').onchange=e=>{const[w,h]=e.target.value.split(',');preview.style.width=w+'px';preview.style.height=h+'px'};
document.getElementById('show').onclick=()=>{
 const w=preview.contentWindow,g=w.RS_TEST,db=w.RS_DATABASE,stage=document.getElementById('stage').value,isMage=['Mage','Wizard'].includes(stage),first=isMage?'mage':'thief';
 g.reset(isMage?'wizard_male':'assassin_male');g.selectWeaponStyle(document.getElementById('weapon').value);g.start();g.state.stage=stage;g.state.lvl=85;g.state.job=50;g.state.stats=isMage?{str:1,agi:9,vit:35,int:99,dex:90,luk:9}:{str:80,agi:90,vit:25,int:10,dex:45,luk:60};
 for(const d of db.skills){g.state[d.stateKey]=[first,stage.toLowerCase()].includes(d.jobId)&&d.implemented?d.maxLevel:0;g.state.skillEnabled[d.id]=!d.utility;}
 g.state.skillPoints=0;g.state.pause=false;g.state.debugInfiniteHp=true;g.state.debugInfiniteSp=true;g.state.t=60;g.state.nextBoss=1e9;g.state.spawn=1e9;g.recalc(true);
 for(let i=0;i<8;i++){g.spawn();const e=g.enemies().at(-1);e.x=g.player.x+50+(i%4)*35;e.y=g.player.y-85+Math.floor(i/4)*120;e.hp=e.max=100000;e.speed=0;}
 for(let i=0;i<30;i++)g.update(.1);g.state.pause=true;g.draw();frozen=true;document.getElementById('motion').textContent='Запустить бой';
};
document.getElementById('motion').onclick=e=>{const g=preview.contentWindow.RS_TEST;frozen=!frozen;g.state.pause=frozen;e.target.textContent=frozen?'Запустить бой':'Заморозить бой'};
</script></html>
